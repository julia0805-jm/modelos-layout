<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 2</title>
    <link rel="stylesheet" href="grids.css">
     <style>
        .topo{
            border: 1px solid black;
            margin-bottom: 5px;
            height: 90px;
        }

        .menu{ 
            border: 1px solid black;
            height: 30px;
            margin-bottom: 5px;
        }

        .conteudo{
            border: 1px solid black;
            height: 400px;
        }

        .coluna-a{
            border: 1px solid black;
            height: 320px;
            margin-bottom:5px;

        }

        .coluna-b{
            border: 1px solid rgb(226, 219, 219);
        }

        .coluna-c{
            background-color: rgb(90, 65, 122);
            height: 100px;
            margin-bottom: 10px;
        }

        .coluna-d{
            background-color: rgb(13, 150, 127);
            height: 100px;
            margin-bottom: 5px;
        }

        .resumo-noticias div{
            border: 1px solid rgb(158, 16, 16);
            height: 100px;
        }

        .rodape{
            border: 1px solid black;
        }

        
     </style>
</head>
<body>
    <div class="container">

        <div class="row">
            <div class="col-12 topo">
                <h1><a href="index.html">voltar</a> Topo</h1> 
    
   
           </div>
        </div>

        <div class="row gap-1">
            <div class="col-12 menu">Menu</div>
        </div>

        <div class="row gap-1">
            <div class="col-6 coluna-a">Coluna A</div>
            <div class="col-6 coluna-b">
                <div class="row">
                    <div class="col-12 coluna-c"> Coluna C</div>
                </div>
                <div class="row">
                    <div class="col-12 coluna-d"> Coluna D</div>
                </div>
                <div class="row gap-1 resumo-noticias">
                    <div class="col-4">Imagem</div>
                    <div class="col-8">Texto</div>
                </div>
            </div>
        </div> 

        <div class="row">
            <div class="col-12 rodape">Rodapé</div>
        </div>

    </div>

</html>
